name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned IPA
        run: |
          cd MyWeChat
          xcodebuild -project MyWeChat.xcodeproj \
            -scheme MyWeChat \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

          APP_PATH="build/Build/Products/Release-iphoneos/MyWeChat.app"
          IPA_PATH="build/MyWeChat.ipa"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$IPA_PATH" Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyWeChat-unsigned-ipa
          path: MyWeChat/build/MyWeChat.ipa
