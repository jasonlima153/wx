name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Unsigned IPA
        run: |
          cd MyWeChat
          xcodebuild -project MyWeChat.xcodeproj \
            -scheme MyWeChat \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.example.MyWeChat \
            -derivedDataPath build

          # Package IPA
          APP_PATH="build/Build/Products/Release-iphoneos/MyWeChat.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r MyWeChat.ipa Payload
            rm -rf Payload
            echo "✅ IPA created successfully"
          else
            echo "❌ App not found at $APP_PATH"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyWeChat-IPA
          path: MyWeChat/MyWeChat.ipa
